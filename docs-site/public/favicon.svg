<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="polinrider-cleaner">
  <!-- Reads at 16px, which rules out anything with detail. A ring with a scan
       line through it: the lattice sphere from the project artwork, reduced
       until only the idea of sweeping something survives. Teal is the site
       accent (oklch(74% 0.115 195), written here in hex for wider support). -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#2fc4b8" stroke-width="3"/>
  <path d="M3 16h26" stroke="#2fc4b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.2" fill="#2fc4b8"/>
</svg>
