# Articles about PolinRider published elsewhere, shown under "Elsewhere" on
# the News page and opened in a new tab. Newest first is worked out by the
# page; the order here does not matter.
#
# An article goes in only when someone has opened it and read it, it names
# PolinRider and is about the campaign, and it comes from a security vendor,
# a researcher or a news outlet. A rewrite of another outlet's report is left
# out in favour of the original. `date` is the publication date shown on the
# article, never the day it was added. `summary` is our own words: one plain
# sentence on what a reader learns, under 25 words.
#
# First filled on 2026-11-04 from a read of each page that day.

