# Semgrep static analysis. Runs the shell and secrets rulesets, which cover
# ground shellcheck does not: injection-shaped patterns and credentials that
# should never have been committed.
#
# No account or token is used. `semgrep scan` reads public rulesets directly;
# `semgrep ci` would require SEMGREP_APP_TOKEN and send results to a third party.
name: Semgrep

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        run: |
          semgrep scan \
            --config p/bash \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude=ioc \
            --exclude='*.md'
