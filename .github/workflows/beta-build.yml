name: Every platform

# Builds the binary for each platform on every push and pull request, and runs
# it on that platform's runner, so a change can be tried on a machine without
# a Rust toolchain. These are workflow artifacts, not a release: they are not
# announced, not attested, and they expire. Releases come from release.yml.
#
# It is also the only place the binary is built and run on macOS and Windows.
# The sandbox is Linux, and ci.yml builds on Linux only. And it is the only
# place the live checks run against a real macOS: a runner is a machine nobody
# minds a file-moving tool being let loose on, which the maintainer's own is
# not. Nothing is ever run on a developer's host. See TESTING.md.

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform failing to build is the result worth having for that
      # platform. It must not hide the others.
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,    exe: polinrider }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, exe: polinrider }
          - { name: macos-arm64,    os: macos-latest,     exe: polinrider }
          - { name: windows-x86_64, os: windows-latest,   exe: polinrider.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install --profile minimal 1.98.1

      - name: Build
        run: |
          # The commit goes into --version, so a binary on a test machine can
          # say which build it is.
          POLINRIDER_COMMIT="${GITHUB_SHA::7}" cargo build --locked --release

      - name: Package
        # The binary with its indicators beside it, which is where it looks
        # for them. A tar archive on purpose: an artifact upload does not keep
        # the executable bit, and a tar inside it does.
        run: |
          dir="polinrider-beta-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp "target/release/${{ matrix.exe }}" "dist/$dir/"
          cp -R ioc "dist/$dir/ioc"
          cp TESTING.md "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"

      - name: The packaged binary runs and finds its indicators
        # From another directory, as an installed copy is run. A binary that
        # cannot find its indicators refuses every scan.
        run: |
          bin="$PWD/dist/polinrider-beta-${{ matrix.name }}/${{ matrix.exe }}"
          cd "${RUNNER_TEMP}"
          "$bin" --version | tee version.txt
          grep -q 'strong' version.txt

      - name: Find, strip and quarantine on this machine
        # The runner is the disposable machine. The sample is the one the
        # sandbox demo uses. It is a full check of the runner itself on every
        # platform, Windows included, and its [review] lines are printed
        # because they are the first look at what a real machine of that kind
        # produces. A "could not" line here is a probe that does not work on
        # a real machine, which no test against supplied state can show.
        run: |
          bin="$PWD/dist/polinrider-beta-${{ matrix.name }}/${{ matrix.exe }}"
          strong="$(sed -e '/^#/d' -e '/^$/d' ioc/strong.txt | head -1)"
          export DEMO_DIR="${RUNNER_TEMP}/prc-demo"
          ./ci/demo.sh --tree-only
          cd "${RUNNER_TEMP}"

          rc=0
          "$bin" check --report check.txt "$DEMO_DIR" >/dev/null || rc=$?
          grep -E '\[(HIT|review)\]|could not' check.txt || true
          [[ $rc -eq 2 ]] || { echo "an infected sample must exit 2, got $rc"; exit 1; }
          # The machine's own state has to have been read, not skipped.
          if grep -qE 'could not (read the process table|read the registry Run keys|list the scheduled tasks)' check.txt; then
            echo "a probe of this machine did not work"; exit 1
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Answered is not enough: a script that printed nothing would
            # read as a machine with nothing on it. A Windows machine always
            # has scheduled tasks, so none read means the probe is broken.
            grep -E 'Run key|scheduled tasks' check.txt || true
            grep -qE '[1-9][0-9]* scheduled tasks read' check.txt \
              || { echo "no scheduled task was read from a Windows machine"; exit 1; }
          fi

          rc=0
          "$bin" clean --apply --quarantine "${RUNNER_TEMP}/q" --report clean.txt "$DEMO_DIR/shop" >/dev/null || rc=$?
          grep -E 'stripped|original kept|quarantined ->|FAILED' clean.txt || true
          [[ $rc -eq 2 ]] || { echo "clean of an infected sample must exit 2, got $rc"; exit 1; }
          if grep -qF "$strong" "$DEMO_DIR/shop/postcss.config.mjs"; then
            echo "the payload is still in the config after clean --apply"; exit 1
          fi
          grep -q 'plugins' "$DEMO_DIR/shop/postcss.config.mjs" \
            || { echo "the config lost its own contents"; exit 1; }
          # The original must be in quarantine, with the payload, and must not
          # be the file in the tree. On Windows this once came out as the
          # same path.
          kept="$(find q/files -name postcss.config.mjs | head -1)"
          [[ -n "$kept" ]] || { echo "the original was not kept in quarantine"; exit 1; }
          grep -qF "$strong" "$kept" || { echo "the copy in quarantine is not the infected original"; exit 1; }
          [[ ! -e "$DEMO_DIR/shop/public/inter-var.woff2" ]] || { echo "the fake font was not moved"; exit 1; }
          [[ -n "$(find q/files -name inter-var.woff2)" ]] || { echo "the fake font is not in quarantine"; exit 1; }
          [[ -f q/manifest.tsv ]] || { echo "no quarantine manifest"; exit 1; }
          echo "found, stripped and quarantined; originals kept"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: polinrider-beta-${{ matrix.name }}
          path: dist/polinrider-beta-${{ matrix.name }}.tar.gz
          retention-days: 30
          if-no-files-found: error

      # After the upload, so a failing test does not withhold the binary. On
      # Linux the suite already runs in ci.yml. On Windows the unit tests
      # assume Unix paths and have never been run; that is its own piece of
      # work, and the step above is the Windows smoke test for now.
      - name: Unit tests and the conformance corpus, on macOS
        if: runner.os == 'macOS'
        run: |
          cargo test --locked
          ./conformance/run.sh --impl rust
