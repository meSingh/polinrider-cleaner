# Cuts a release from a signed tag: a source archive, its SHA-256 checksum, and
# a build-provenance attestation proving the archive was produced by this
# workflow, from this repository, at that commit.
#
# The point of this repository is recovering from tampered code. Publishing a
# release nobody can verify would be inconsistent with that.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # record the attestation
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tests pass at this tag
        run: |
          ./ci/selftest.sh
          ./ci/selftest-restore.sh
          ./ci/selftest-implant.sh

      # The tag reaches the shell through the environment, never through
      # expression interpolation. `run: TAG="${{ inputs.tag }}"` would let anyone
      # who can dispatch this workflow execute arbitrary commands in a job that
      # holds contents:write and attestation signing rights.
      - name: Build the archive
        id: build
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "refusing to release from a tag that is not vN...: $TAG" >&2; exit 1 ;;
          esac
          NAME="polinrider-cleaner-${TAG}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist/${NAME}.tar.gz" HEAD
          cd dist
          sha256sum "${NAME}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"   >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.build.outputs.name }}.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          sed "s/__TAG__/${TAG}/g" .github/release-notes.md > notes.md
          gh release create "$TAG" \
            "dist/${NAME}.tar.gz" \
            dist/SHA256SUMS \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag
