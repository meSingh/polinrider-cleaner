# The documentation site.
#
# Builds on every push and pull request, so a broken link or a bad book.toml
# fails the check rather than the deploy. Publishes only from main: the site
# describes the released tool, not whatever is in flight on a branch.
#
# GitHub Pages is enabled with the source set to "GitHub Actions".
#
# Built with plain Astro (ADR-0055). `npm run build` starts with
# docs-site/scripts/check-base.mjs, which fails when the site's address is
# written outside src/siteConfig.mjs, and ends with check-links.mjs, which
# fails on any internal link that does not reach a page, an anchor on it or
# a redirect.
#
# Release pages are dated from their tags (docs-site/src/releaseDate.ts) and
# every page's "Last updated" from its file's last commit, so the build
# fetches the full history and the tags, and the Release workflow runs this on main once
# a release is published, which is when that date first exists.
name: Docs

on:
  push:
    branches: [main]
    paths: ['docs-site/**', 'docs/adr/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs-site/**', 'docs/adr/**', '.github/workflows/docs.yml']
  # Every day, so the home page's live badges (CI, Semgrep, OpenSSF
  # Scorecard), read when the site is built, stay current.
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: every page shows the day its own file last changed
          # (docs-site/src/git.ts), which a shallow clone cannot tell; it
          # would give every page the date of the commit being built. Tags
          # come with it, and the release pages read their dates from them.
          fetch-depth: 0
          fetch-tags: true

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install, from the lockfile only
        # npm ci fails rather than silently resolving a different tree, which
        # is the property that matters for a repository about supply chains.
        run: npm ci --prefix docs-site

      - name: Build
        # The token only reads workflow runs for the live badges
        # (docs-site/src/badges.ts), and lifts the anonymous rate limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build --prefix docs-site

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    name: Publish to GitHub Pages
    # A push to main, the daily run, or a run of main asked for by hand or
    # by the Release workflow.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write       # publish
      id-token: write    # OIDC, required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
