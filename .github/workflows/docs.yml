# The documentation site.
#
# Builds on every push and pull request, so a broken link or a bad book.toml
# fails the check rather than the deploy. Publishes only from main: the site
# describes the released tool, not whatever is in flight on a branch.
#
# GitHub Pages is enabled with the source set to "GitHub Actions".
#
# Built with Astro + Starlight. Astro fails the build on a broken internal
# link by itself, so there is no separate link-checking step.
name: Docs

on:
  push:
    branches: [main, v2]
    paths: ['docs-site/**', 'docs/adr/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs-site/**', 'docs/adr/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install, from the lockfile only
        # npm ci fails rather than silently resolving a different tree, which
        # is the property that matters for a repository about supply chains.
        run: npm ci --prefix docs-site

      - name: Build
        run: npm run build --prefix docs-site

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write       # publish
      id-token: write    # OIDC, required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
