name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check every script
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning --external-sources

      # Dependabot only reads .github/workflows, so the pin in the template that
      # users vendor into their own repositories drifts silently. Fail here
      # instead of shipping them a stale action.
      - name: Vendored workflow template pins the same action revision
        run: |
          here=$(grep -o 'actions/checkout@[0-9a-f]\{40\}' .github/workflows/ci.yml | sort -u)
          tmpl=$(grep -o 'actions/checkout@[0-9a-f]\{40\}' ci/polinrider-scan.yml | sort -u)
          echo "workflow: $here"
          echo "template: $tmpl"
          if [ "$here" != "$tmpl" ]; then
            echo "Pin drift. Update ci/polinrider-scan.yml to match, then re-run ci/install-workflow.sh on repos that vendored it." >&2
            exit 1
          fi

      - name: Detection self-test
        run: ./ci/selftest.sh

      - name: Restore planner self-test
        run: ./ci/selftest-restore.sh

      - name: Implant detection self-test
        run: ./ci/selftest-implant.sh

      - name: Entry point self-test
        run: ./ci/selftest-entrypoint.sh

      - name: Self-test - next steps and evidence location
        run: ./ci/selftest-nextsteps.sh

      - name: Self-test - preserving restore points
        run: ./ci/selftest-preserve.sh

      - name: Self-test - history rewrite
        run: ./ci/selftest-rewrite.sh

  powershell:
    name: PowerShell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse and analyse check-windows.ps1
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./machine-cleanup/check-windows.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { $_.Message }; exit 1 }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          }
          $r = Invoke-ScriptAnalyzer -Path ./machine-cleanup/check-windows.ps1 -Severity Error,Warning
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host "PowerShell clean"

  self-scan:
    name: Scan this repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This repository contains indicator strings by design: they are what it
      # detects. The scanner must still come back clean once its own detection
      # code is excluded, which is what proves the exclusion logic works.
      # Markdown is skipped by the scanner's own defaults.
      - name: Scan with detection tooling excluded
        run: |
          ./ci/scan-workspace.sh --path . --all-refs --fail-on infected \
            --exclude '(^|/)(lib|ci|github-org-recovery|github-account-recovery|machine-cleanup)/'
