name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check every script
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning --external-sources

      # Dependabot only reads .github/workflows, so the pin in the template that
      # users vendor into their own repositories drifts silently. Fail here
      # instead of shipping them a stale action.
      - name: Vendored workflow template pins the same action revision
        run: |
          here=$(grep -o 'actions/checkout@[0-9a-f]\{40\}' .github/workflows/ci.yml | sort -u)
          tmpl=$(grep -o 'actions/checkout@[0-9a-f]\{40\}' ci/polinrider-scan.yml | sort -u)
          echo "workflow: $here"
          echo "template: $tmpl"
          if [ "$here" != "$tmpl" ]; then
            echo "Pin drift. Update ci/polinrider-scan.yml to match, then re-run ci/install-workflow.sh on repos that vendored it." >&2
            exit 1
          fi

      - name: Detection self-test
        run: ./ci/selftest.sh

      - name: Rust toolchain
        run: rustup toolchain install --profile minimal --component clippy,rustfmt 1.98.1

      - name: Rust - format, lint, test
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Conformance corpus
        # The specification. The shell machine check answered to it too, until
        # the two agreed and the shell one was removed.
        run: |
          cargo build --locked --release
          ./conformance/run.sh

  self-scan:
    name: Scan this repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This repository contains indicator strings by design: they are what it
      # detects. The scanner must still come back clean once its own detection
      # code is excluded, which is what proves the exclusion logic works.
      # Markdown is skipped by the scanner's own defaults, but docs-site/book/
      # is the rendered HTML of that same Markdown, so it carries the same
      # strings without the .md extension that would exempt it. conformance/
      # is excluded for the same reason as ci/ and src/: a corpus that tests
      # for an indicator has to contain it. lib/ and github-*-recovery/ are
      # gone from the tree but not from history, which --all-refs reads.
      - name: Scan with detection tooling excluded
        run: |
          ./ci/scan-workspace.sh --path . --all-refs --fail-on infected \
            --exclude '(^|/)(lib|ci|src|conformance|github-org-recovery|github-account-recovery)/|(^|/)docs-site/(book|dist|node_modules|\\.astro)/'
